<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare AI Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md flex items-center justify-between">
        <h1 class="text-xl font-bold tracking-wide text-orange-500">⚡ Cloudflare AI App</h1>
        <span class="text-xs bg-gray-700 px-2.5 py-1 rounded-full text-gray-400">Llama 3.3 + KV Memory</span>
    </header>

    <!-- Chat Messages Box -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <div class="bg-gray-800 p-4 rounded-lg shadow max-w-[80%] border border-gray-700">
            <p class="text-xs text-orange-400 font-semibold mb-1">System</p>
            <p class="text-sm">Hello!</p>
        </div>
    </main>

    <!-- Sticky Input Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 p-4">
        <form id="chat-form" class="max-w-4xl w-full mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your message here..." 
                class="flex-1 bg-gray-700 text-white rounded-lg px-4 py-3 border border-gray-600 focus:outline-none focus:border-orange-500 text-sm"
                required
                autocomplete="off"
            >
            <button 
                type="submit" 
                id="send-btn" 
                class="bg-orange-600 hover:bg-orange-500 transition-colors text-white font-medium px-6 py-3 rounded-lg text-sm shadow-md"
            >
                Send
            </button>
        </form>
    </footer>

    <script>
        // Generate or fetch unique session ID for state preservation
        let sessionId = localStorage.getItem('chat_session_id');
        if (!sessionId) {
            sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('chat_session_id', sessionId);
        }

        // REPLACE THIS WITH YOUR LIVE WORKER DEPLOYMENT URL LATER
        const WORKER_URL = window.location.origin.includes('localhost') 
            ? 'http://127.0.0.1:8787' 
            : 'https://cloudflare-ai-assistant.rithick-s49.workers.dev'; // Assuming a Cloudflare Pages Functions proxy, or replace with explicit worker link

        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(sender, text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = isUser 
                ? 'bg-orange-600/20 border border-orange-500/30 p-4 rounded-lg shadow max-w-[80%] ml-auto text-right'
                : 'bg-gray-800 border border-gray-700 p-4 rounded-lg shadow max-w-[80%]';
            
            messageDiv.innerHTML = `
                <p class="text-xs ${isUser ? 'text-orange-400' : 'text-gray-400'} font-semibold mb-1">${sender}</p>
                <p class="text-sm whitespace-pre-line">${text}</p>
            `;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Render User Input
            appendMessage('You', text, true);
            userInput.value = '';
            
            // Disable inputs while loading
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerText = 'Thinking...';

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, sessionId: sessionId })
                });

                if (!response.ok) throw new Error('Failed to fetch response from edge');

                const data = await response.json();
                appendMessage('AI Assistant', data.response, false);

            } catch (error) {
                appendMessage('Error', 'Could not reach the AI worker. Make sure your backend configuration is running.', false);
                console.error(error);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerText = 'Send';
                userInput.focus();
            }
        });
    </script>
</body>
</html>
